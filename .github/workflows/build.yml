  - name: Select Xcode
    run: |
      sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      xcodebuild -version

  - name: Install Rust
    run: |
      rustup toolchain install 1.98.1
      rustup target add aarch64-apple-ios --toolchain 1.98.1

  - name: Install XcodeGen
    run: |
      brew install xcodegen

  - name: Build unsigned IPA
    shell: bash
    run: |
      chmod +x make-ios.sh

      if [ "${{ inputs.include_game }}" = "with_game" ]; then
        if [ ! -f game.zip ]; then
          echo "ERROR: game.zip is missing from the repository root."
          exit 1
        fi

        FREE=1 BUNDLE_ID=com.example.muguet ./make-ios.sh game.zip --ipa
      else
        FREE=1 BUNDLE_ID=com.example.muguet ./make-ios.sh --ipa
      fi

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: Muguet-IPA
      path: build/Muguet.ipa
      if-no-files-found: error
      retention-days: 7

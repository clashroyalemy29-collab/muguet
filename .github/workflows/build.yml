name: Build Muguet IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check build script
        run: |
          test -f make-ios.sh
          chmod +x make-ios.sh

      - name: Build IPA
        run: |
          FREE=1 BUNDLE_ID=com.example.muguet ./make-ios.sh --ipa

      - name: Find IPA
        run: |
          find . -type f -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: "**/*.ipa"
          if-no-files-found: error
          retention-days: 7
